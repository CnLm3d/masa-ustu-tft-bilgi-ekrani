[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DUSER_SETUP_LOADED=1
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTOUCH_CS=27
    -DHAS_BT_SPEAKER=1

[env:esp32dev_4inch]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DRPI_DISPLAY_TYPE=1
    -DILI9486_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSCREEN_480X320=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=16000000
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTOUCH_CS=27
    -DHAS_BT_SPEAKER=1

[env:esp32c3]
platform = ${common.platform}
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTFT_SCLK=4
    -DTFT_MISO=5
    -DTFT_MOSI=6
    -DTFT_CS=7
    -DTFT_DC=2
    -DTFT_RST=3
    -DTOUCH_CS=10
    -DHAS_BT_SPEAKER=0
